---
'on':
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'README.md'
jobs:
  # @TODO: Lint has never run against this role's older task style. Enable and
  # clean up separately, the way ansible-role-mariadb did.
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: checkout
  #       uses: actions/checkout@v4
  #     - name: Run ansible-lint
  #       uses: ansible/ansible-lint@main
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - geerlingguy/docker-ubuntu2604-ansible:latest
          - geerlingguy/docker-ubuntu2404-ansible:latest
          - geerlingguy/docker-ubuntu2204-ansible:latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule tests
        run: molecule test
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."
          MOLECULE_DOCKER_IMAGE: "${{ matrix.image }}"
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
